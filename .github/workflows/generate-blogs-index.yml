name: Generate Blogs Index

on:
  push:
    paths:
      - 'public/blogs/**'
      - 'scripts/generate_blogs_index.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run script to generate blogs.json
        run: python scripts/generate_blogs_index.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/json/blogs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate blogs.json" && git push)
